services:

  postgres:
    image: postgres:16
    container_name: world_eldoria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eldoria
      POSTGRES_PASSWORD: eldoria_password
      POSTGRES_DB: world_eldoria
    ports:
      - "5432:5432"
    volumes:
      - eldoria_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: world_eldoria_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - eldoria_redis_data:/data

volumes:
  eldoria_postgres_data:
  eldoria_redis_data: