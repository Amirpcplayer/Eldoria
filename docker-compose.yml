services:
  postgres:
    image: postgres:16
    container_name: world_eldoria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eldoria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eldoria_password}
      POSTGRES_DB: ${POSTGRES_DB:-world_eldoria}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - eldoria_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: world_eldoria_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - eldoria_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eldoria_postgres_data:
  eldoria_redis_data:
