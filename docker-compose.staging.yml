# Isolated performance-test dependencies only. No bot service is defined here.
services:
  postgres-staging:
    image: postgres:16
    container_name: world_eldoria_postgres_staging
    restart: "no"
    environment:
      POSTGRES_USER: eldoria_staging
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?Set STAGING_POSTGRES_PASSWORD}
      POSTGRES_DB: world_eldoria_staging
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - eldoria_postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eldoria_staging -d world_eldoria_staging"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-staging:
    image: redis:7
    container_name: world_eldoria_redis_staging
    restart: "no"
    environment:
      REDIS_PASSWORD: ${STAGING_REDIS_PASSWORD:?Set STAGING_REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${STAGING_REDIS_PASSWORD:?Set STAGING_REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - eldoria_redis_staging_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  eldoria_postgres_staging_data:
  eldoria_redis_staging_data:
